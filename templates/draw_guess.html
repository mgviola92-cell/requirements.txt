<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Draw & Guess</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
@font-face{font-family:Myanmar;src:url('/draw/font')}*{box-sizing:border-box}body{margin:0;padding:16px;background:#101724;color:#f4f7ff;font:16px/1.6 Myanmar,sans-serif}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:21px;margin:0}#word{font-size:24px;padding:12px 0;color:#8ce8d0}canvas{display:block;width:100%;height:auto;touch-action:none;background:white;border-radius:14px}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button,input{min-height:42px;border:0;border-radius:10px;padding:8px 14px}button{background:#29374e;color:white;cursor:pointer}#send{background:#73e0c5;color:#10251d;font-weight:bold;flex:1}#status{min-height:48px;color:#b9c8e0}input[type=range]{width:120px}.swatch{width:36px;min-height:36px;padding:0;border:2px solid #ffffff55}small{color:#9dadc6}</style></head><body><header><h1 id="title">🎨 Draw & Guess</h1><span id="clock"></span></header><div id="word">…</div><canvas id="canvas" width="760" height="500"></canvas><div class="tools"><input type="color" id="color" value="#172136" aria-label="Color"><input type="range" id="size" min="2" max="30" value="6" aria-label="Brush size"><button id="eraser">ခဲဖျက်</button><button id="undo">နောက်ပြန်</button><button id="clear">ရှင်းမယ်</button><button id="send">Group ဆီပို့မယ်</button></div><div id="status"></div><small id="hint">စကားလုံးကို စာနဲ့မရေးဘဲ ပုံနဲ့ပဲရှင်းပြပါ။ အဖြေမှန်ကို private ထဲမှာသာပြထားသည်။</small><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const params=new URLSearchParams(location.search),ticket=params.get('ticket'),gid=params.get('game');const c=document.getElementById('canvas'),ctx=c.getContext('2d');let down=false,dirty=false,busy=false,closed=false,deadline=0,undo=[];
ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.lineCap='round';ctx.lineJoin='round';
let labels={loading:'ပို့နေသည်…',clear_confirm:'ပုံကိုရှင်းမလား?',expired:'အချိန်ကုန်ပြီ။ Group ထဲပြန်သွားပါ။'};const status=document.getElementById('status');function point(e){const b=c.getBoundingClientRect();return [(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]}
function saveUndo(){undo.push(ctx.getImageData(0,0,c.width,c.height));if(undo.length>12)undo.shift()}
c.addEventListener('pointerdown',e=>{if(closed)return;saveUndo();down=true;c.setPointerCapture(e.pointerId);ctx.strokeStyle=document.getElementById('color').value;ctx.lineWidth=+document.getElementById('size').value;const [x,y]=point(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.01,y+.01);ctx.stroke();dirty=true});c.addEventListener('pointermove',e=>{if(!down)return;ctx.lineTo(...point(e));ctx.stroke();dirty=true});c.addEventListener('pointerup',()=>{down=false});c.addEventListener('pointercancel',()=>{down=false});
document.getElementById('eraser').onclick=()=>{document.getElementById('color').value='#ffffff'};document.getElementById('undo').onclick=()=>{if(undo.length){ctx.putImageData(undo.pop(),0,0);dirty=true}};document.getElementById('clear').onclick=()=>{if(confirm(labels.clear_confirm)){saveUndo();ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);dirty=true}};
async function api(action,image){const r=await fetch('/draw/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,game:gid,ticket,init_data:tg?.initData||'',image})});const d=await r.json();if(!r.ok)throw Error(d.error||'ခေတ္တအဆင်မပြေပါ။');return d}
async function send(){if(busy||closed||!dirty)return;busy=true;status.textContent=labels.loading;try{const snapshot=c.toDataURL('image/png');const d=await api('image',snapshot);deadline=d.deadline;dirty=c.toDataURL('image/png')!==snapshot;status.textContent=d.saved||'Group ဆီပို့ပြီးပြီ။'}catch(e){status.textContent=e.message}finally{busy=false}}
document.getElementById('send').onclick=send;setInterval(()=>{if(dirty&&!down)send()},10000);setInterval(()=>{if(deadline){const sec=Math.max(0,Math.ceil(deadline-Date.now()/1000));document.getElementById('clock').textContent=sec+'s';if(!sec){closed=true;status.textContent=labels.expired}}},1000);
api('state').then(d=>{if(d.labels){labels=d.labels;for(const key of ['eraser','undo','clear','send'])document.getElementById(key).textContent=labels[key];}document.getElementById('title').textContent=d.title;document.getElementById('word').textContent=d.word;document.getElementById('hint').textContent=d.hint;deadline=d.deadline;if(d.image){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=d.image}}).catch(e=>{status.textContent=e.message;closed=true});
</script></body></html>
