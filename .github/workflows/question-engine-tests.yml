name: Question engine tests
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'games/pair_challenge.py'
      - 'tests/**'
      - '.github/workflows/question-engine-tests.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline question engine tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
